name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env: { SKIP: "mypy,pytest,tsc,eslint,prettier" }  # heavy hooks run in the jobs below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true, cache-dependency-glob: "backend/requirements*.txt" }
      - run: uv venv --python 3.12 && uv pip install -r requirements-dev.txt
      - run: . .venv/bin/activate && ruff check . && ruff format --check .
      - run: . .venv/bin/activate && mypy .
      - run: . .venv/bin/activate && pytest -q -n auto --cov --cov-report=xml --cov-report=term:skip-covered
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: backend-coverage, path: backend/coverage.xml }

  migrations:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true, cache-dependency-glob: "backend/requirements*.txt" }
      - run: uv venv --python 3.12 && uv pip install -r requirements-dev.txt
      - name: Migrations on SQLite + Postgres
        run: . .venv/bin/activate && pytest -q tests/test_migrations.py
      - name: Full suite on Postgres
        run: . .venv/bin/activate && TEST_DATABASE_URL="$TEST_POSTGRES_URL" pytest -q --ignore=tests/test_migrations.py

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: backend, load: true, tags: "alphabridge-backend:ci", cache-from: "type=gha,scope=backend", cache-to: "type=gha,scope=backend,mode=max" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: frontend, load: true, tags: "alphabridge-frontend:ci", cache-from: "type=gha,scope=frontend", cache-to: "type=gha,scope=frontend,mode=max" }
      - name: Smoke test backend health
        run: |
          docker run -d --name ab -p 5000:5000 -e ACCESS_TOKEN=ci -e APP_SECRET=ci-secret -e ENABLE_SCHEDULER=0 -e DATABASE_URL=sqlite:////tmp/ab.db alphabridge-backend:ci
          for _ in $(seq 1 30); do curl -fs localhost:5000/api/health && exit 0; sleep 2; done
          docker logs ab; exit 1
