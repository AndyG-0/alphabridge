services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Workaround: some ARM VMs (e.g. podman applehv) advertise CPU features that make OpenSSL crash with SIGILL.
      OPENSSL_armcap: "0"
      TRUST_PROXY: "1"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
