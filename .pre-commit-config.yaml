repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && .venv/bin/mypy .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint --silent'
        language: system
        pass_filenames: false
        files: ^frontend/src/
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npm run format:check --silent'
        language: system
        pass_filenames: false
        files: ^frontend/
