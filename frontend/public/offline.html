<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>Offline - AlphaBridge</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #0b1220;
        color: #e2e8f0;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #94a3b8;
        line-height: 1.5;
      }
      button {
        margin-top: 0.75rem;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #34d399;
        color: #022c22;
        font-weight: 600;
        font-size: 1rem;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f8fafc;
          color: #0f172a;
        }
        p {
          color: #475569;
        }
        button {
          background: #047857;
          color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>AlphaBridge needs a connection to load your financial data. Nothing is stored on this device. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
